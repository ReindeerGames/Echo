services:
  echo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_IMAGE:-reindeergames/echo}:v2-local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ECHO_HTTP_ADDRESS: :8080
      ECHO_WORKSPACE_ROOT: /var/lib/echo/workers
    ports:
      - "${ECHO_PORT:-8080}:8080"
    volumes:
      - worker_data:/var/lib/echo/workers
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge]

volumes:
  worker_data:

networks:
  edge:
